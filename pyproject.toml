[project]
name = "ovc-backend"
version = "0.1.0"
description = "Open vCenter backend - REST API + RabbitMQ worker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "aio-pika>=9.5",
    "redis>=5.2",
    "python-json-logger>=3.2",
    "httpx>=0.28",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.18",
    "aioboto3>=13.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
]

[project.scripts]
ovc-api = "app.__main__:run_api"
ovc-worker = "app.worker.__main__:run_worker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
