[project]
name = "ovc-backend"
version = "0.1.0"
description = "Open vCenter backend - REST API + RabbitMQ worker"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31",
    "alembic>=1.19",
    "aio-pika>=10.0",
    "redis>=8.1",
    "python-json-logger>=4.2",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.32",
    "aioboto3>=15.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "anyio>=4.14",
]

[project.scripts]
ovc-api = "app.__main__:run_api"
ovc-worker = "app.worker.__main__:run_worker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
